<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Nitra Weather Login
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>

<body>

<div class="background"></div>

<div class="login-container">

  <div class="login-box">

    <div class="logo">
      NITRA WEATHER
    </div>

    <h1>
      Prihlásenie
    </h1>

    <p class="subtitle">
      Profesionálny meteorologický systém
    </p>

    <div class="input-group">

      <label>
        Používateľské meno
      </label>

      <input
        type="text"
        id="username"
        placeholder="Zadajte meno"
      >

    </div>

    <div class="input-group">

      <label>
        Heslo
      </label>

      <input
        type="password"
        id="password"
        placeholder="Zadajte heslo"
      >

    </div>

    <button onclick="login()">
      PRIHLÁSIŤ SA
    </button>

    <div id="error"></div>

  </div>

</div>

<script src="login.js"></script>

</body>
</html>
